<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Taxis</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Mis Taxis</h1>
  <div id="user-bar" class="hidden">
    <span id="user-name"></span>
    <button id="logout-btn" type="button">Salir</button>
  </div>
</header>

<main>
  <section id="login-view">
    <div id="pin-login-block">
      <h2>Ingresar con PIN</h2>
      <p id="pin-login-intro">Elegí tu nombre y escribí tu PIN (dueños y choferes entran igual).</p>
      <form id="login-form">
        <div id="company-select-block">
          <label for="company-select">Empresa</label>
          <select id="company-select" required></select>
        </div>
        <p id="fixed-company-name" class="hidden"></p>
        <p id="fixed-user-name" class="hidden"></p>
        <label for="user-select">Quién sos</label>
        <select id="user-select" required></select>
        <label for="pin-input">PIN</label>
        <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Tu PIN" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="login-error" class="error hidden"></p>
      <p id="owner-login-btn-row"><button id="show-owner-login-btn" type="button">Soy dueño: entrar con email y PIN</button></p>
    </div>
    <div id="owner-login-block" class="hidden">
      <h2>Ingresar como dueño</h2>
      <p>Entrá con tu email y PIN.</p>
      <form id="owner-login-form">
        <label>Email <input name="email" type="email" required></label>
        <label>PIN <input name="pin" type="password" inputmode="numeric" required></label>
        <button type="submit">Entrar como dueño</button>
      </form>
      <p id="owner-login-error" class="error hidden"></p>
    </div>
  </section>

  <section id="app-view" class="hidden">
    <nav id="tabs"></nav>
    <div id="message"></div>
    <div id="content"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
