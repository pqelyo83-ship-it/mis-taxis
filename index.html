<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Taxis</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Mis Taxis</h1>
  <div id="user-bar" class="hidden">
    <span id="user-name"></span>
    <button id="logout-btn" type="button">Salir</button>
  </div>
</header>

<main>
  <section id="login-view">
    <h2>Ingresar con PIN</h2>
    <p>Choferes: seleccioná tu empresa, tu nombre y escribí tu PIN. Dueños: entran con email y contraseña.</p>
    <form id="login-form">
      <label for="company-select">Empresa</label>
      <select id="company-select" required></select>
      <label for="user-select">Quién sos</label>
      <select id="user-select" required></select>
      <label for="pin-input">PIN</label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Tu PIN" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="login-error" class="error hidden"></p>
    <p><button id="show-owner-login-btn" type="button">Soy dueño: entrar con email</button></p>
    <form id="owner-login-form" class="hidden">
      <label>Email <input name="email" type="email" required></label>
      <label>Contraseña <input name="password" type="password" required></label>
      <button type="submit">Entrar como dueño</button>
    </form>
    <p id="owner-login-error" class="error hidden"></p>
  </section>

  <section id="app-view" class="hidden">
    <nav id="tabs"></nav>
    <div id="message"></div>
    <div id="content"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
