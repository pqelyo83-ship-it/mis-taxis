<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Taxis</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Mis Taxis</h1>
  <div id="user-bar" class="hidden">
    <span id="user-name"></span>
    <button id="logout-btn" type="button">Salir</button>
  </div>
</header>

<main>
  <section id="login-view">
    <h2>Ingresar con PIN</h2>
    <p>Seleccioná tu empresa, tu nombre y escribí tu PIN. No hace falta email ni contraseña.</p>
    <form id="login-form">
      <label for="company-select">Empresa</label>
      <select id="company-select" required></select>
      <label for="user-select">Quién sos</label>
      <select id="user-select" required></select>
      <label for="pin-input">PIN</label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="Tu PIN" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="login-error" class="error hidden"></p>
    <p><button id="show-register-btn" type="button">Soy dueño: crear una empresa nueva</button></p>
    <form id="register-form" class="hidden">
      <label>Nombre de la empresa <input name="company_name" type="text" required></label>
      <label>Tu nombre (dueño) <input name="admin_name" type="text" required></label>
      <label>PIN del dueño <input name="pin" type="password" inputmode="numeric" required></label>
      <button type="submit">Crear mi empresa</button>
    </form>
    <p id="register-result" class="hidden"></p>
  </section>

  <section id="app-view" class="hidden">
    <nav id="tabs"></nav>
    <div id="message"></div>
    <div id="content"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
